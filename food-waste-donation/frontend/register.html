<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | FoodShare</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <nav class="navbar">
      <a class="brand" href="index.html">FoodShare</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="available-food.html">Available Food</a>
        <a href="register.html" class="active">Register</a>
        <a href="login.html">Login</a>
      </div>
    </nav>
  </header>

  <main class="auth-page">
    <section class="auth-container">
      <div class="auth-card">
        <div class="section-heading center">
          <span class="section-tag">Join FoodShare</span>
          <h2>Create an Account</h2>
        </div>
        <form id="registerForm" class="auth-form">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required placeholder="Enter your name" />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="Enter your email" />
          </div>
          <div class="form-group">
            <label for="phone">Phone</label>
            <input type="text" id="phone" name="phone" required placeholder="Enter your phone" />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Enter your password" />
          </div>
          <div class="form-group">
            <label for="role">Role</label>
            <select id="role" name="role" required>
              <option value="Donor">Donor</option>
              <option value="Receiver">Receiver</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Register</button>
          <p class="auth-link">Already have an account? <a href="login.html">Login</a></p>
          <div id="registerMessage" class="message"></div>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 FoodShare. All rights reserved.</p>
  </footer>

  <script src="js/auth.js"></script>
</body>
</html>
